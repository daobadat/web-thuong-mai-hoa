<footer class="bg-[#2B2A26] text-white py-12">
  <div class="site-container">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-8 mb-10">
      <div>
        <div class="flex items-center gap-2 mb-3">
          <span class="text-2xl">🌸</span>
          <span class="text-xl font-semibold font-serif"
                [ngClass]="langService.currentLang() === 'ko' ? 'font-display-ko' : 'font-display-vi'">
            {{ langService.t.brand }}
          </span>
        </div>
        <p class="text-xs text-white/50 leading-relaxed">{{ langService.t.footer.deliver }}</p>
      </div>
      <div class="space-y-2">
        <p class="text-sm text-white/80">{{ langService.t.footer.hotline }}</p>
        <a href="https://zalo.me/0901234567" target="_blank" rel="noopener noreferrer"
           class="text-sm text-white/60 hover:text-[#D9A6A0] transition-colors block">
          {{ langService.t.footer.zalo }}
        </a>
        <a href="https://open.kakao.com/o/kflower_vn" target="_blank" rel="noopener noreferrer"
           class="text-sm text-white/60 hover:text-[#FEE500] transition-colors flex items-center gap-1.5">
          <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-[#FEE500] text-[#3C1E1E] text-[10px] font-bold">K</span>
          {{ langService.t.footer.kakao }}
        </a>
      </div>
      <div class="flex gap-4 items-start">
        <a href="https://zalo.me/0901234567" target="_blank" rel="noopener noreferrer" class="text-xs text-white/50 hover:text-[#D9A6A0] transition-colors">Zalo</a>
        <a href="https://open.kakao.com/o/kflower_vn" target="_blank" rel="noopener noreferrer" class="text-xs text-white/50 hover:text-[#FEE500] transition-colors">KakaoTalk</a>
        <a href="#" class="text-xs text-white/50 hover:text-[#D9A6A0] transition-colors">Instagram</a>
      </div>
    </div>
    <div class="border-t border-white/10 pt-6 text-center">
      <p class="text-xs text-white/40">© 2026 {{ langService.t.brand }} · {{ langService.t.footer.rights }}</p>
    </div>
  </div>
</footer>
