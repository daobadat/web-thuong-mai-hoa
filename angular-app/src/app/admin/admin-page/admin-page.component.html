<div class="flex h-screen bg-[#FAF7F2] font-sans antialiased text-[#2C1A2E]" [ngClass]="langService.currentLang() === 'ko' ? 'font-display-ko' : 'font-display-vi'">
  <!-- Sidebar -->
  <aside class="flex flex-col bg-[#2C1A2E] text-white transition-all duration-300 min-h-screen flex-shrink-0 z-20 shadow-xl border-r border-white/5"
         [ngClass]="collapsed ? 'w-16' : 'w-60'">
    <!-- Logo & Brand Header -->
    <div class="flex items-center gap-3 px-4 py-4 border-b border-white/10" [ngClass]="collapsed ? 'justify-center px-2' : ''">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#8B4A5C] to-rose-400 flex items-center justify-center text-white shadow-md flex-shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 21a9 9 0 01-9-9c0-3.5 2-6 4-7.5C8 8.5 9 10 12 10s4-1.5 5-5.5c2 1.5 4 4 4 7.5a9 9 0 01-9 9z"/>
        </svg>
      </div>
      <div *ngIf="!collapsed" class="min-w-0">
        <div class="font-serif text-base font-bold text-white tracking-wide leading-tight truncate">{{ t.brand }}</div>
        <div class="text-[11px] text-rose-200/70 font-medium tracking-wider uppercase">{{ t.panel }}</div>
      </div>
    </div>

    <!-- Language Switcher in Sidebar -->
    <div class="px-3 pt-3 pb-1" *ngIf="!collapsed">
      <button (click)="toggleLanguage()"
              class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/15 text-white/90 text-xs font-semibold border border-white/10 transition-colors">
        <span class="flex items-center gap-1.5">
          <span>{{ langService.currentLang() === 'ko' ? '🇰🇷' : '🇻🇳' }}</span>
          <span>{{ langService.currentLang() === 'ko' ? '한국어' : 'Tiếng Việt' }}</span>
        </span>
        <span class="text-[10px] text-rose-300 uppercase bg-white/10 px-1.5 py-0.5 rounded font-mono">
          {{ langService.currentLang() === 'ko' ? 'KR' : 'VI' }}
        </span>
      </button>
    </div>
    
    <!-- Navigation Links -->
    <nav class="flex-1 py-3 space-y-1 px-2.5 overflow-y-auto">
      <a *ngFor="let item of navItems"
         [routerLink]="item.link"
         routerLinkActive="active-nav-link"
         [routerLinkActiveOptions]="{exact: item.link === '/admin/dashboard'}"
         class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-all duration-150 text-white/70 hover:bg-white/10 hover:text-white"
         [ngClass]="collapsed ? 'justify-center px-0' : ''"
         [title]="collapsed ? getNavLabel(item.id) : ''">
        
        <!-- Icons -->
        <span class="w-5 h-5 flex-shrink-0 flex items-center justify-center text-white/80">
          <ng-container [ngSwitch]="item.id">
            <!-- Dashboard -->
            <svg *ngSwitchCase="'dashboard'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <!-- Orders -->
            <svg *ngSwitchCase="'orders'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <!-- Products -->
            <svg *ngSwitchCase="'products'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            <!-- Categories -->
            <svg *ngSwitchCase="'categories'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            <!-- Customers -->
            <svg *ngSwitchCase="'customers'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <!-- Analytics -->
            <svg *ngSwitchCase="'analytics'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <!-- Settings -->
            <svg *ngSwitchCase="'settings'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </ng-container>
        </span>

        <!-- Label -->
        <span *ngIf="!collapsed" class="flex-1 font-medium text-sm">{{ getNavLabel(item.id) }}</span>

        <!-- Badge for New Orders -->
        <span *ngIf="item.id === 'orders' && newOrdersCount > 0"
              class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-rose-500 text-white shadow-sm tabular-nums"
              [ngClass]="collapsed ? 'absolute -top-1 -right-1 px-1.5 text-[10px]' : ''">
          {{ newOrdersCount }}
        </span>
      </a>
    </nav>
    
    <!-- Bottom User Profile & Actions Section -->
    <div class="p-3 border-t border-white/10 space-y-2 bg-black/10">
      <!-- Store front link -->
      <a routerLink="/"
         class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition-colors text-xs font-medium"
         [ngClass]="collapsed ? 'justify-center px-0' : ''"
         [title]="collapsed ? t.storeFront : ''">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        <span *ngIf="!collapsed">{{ t.storeFront }}</span>
      </a>

      <!-- Collapse / Expand toggle -->
      <button (click)="toggleCollapse()"
              class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition-colors text-xs font-medium"
              [ngClass]="collapsed ? 'justify-center px-0' : ''"
              [title]="collapsed ? t.expand : t.collapse">
        <svg class="w-4 h-4 flex-shrink-0 transition-transform duration-200" [ngClass]="collapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
        <span *ngIf="!collapsed">{{ collapsed ? t.expand : t.collapse }}</span>
      </button>

      <!-- User Card with Logout -->
      <div class="pt-2 border-t border-white/10 flex items-center gap-3 px-1" [ngClass]="collapsed ? 'justify-center px-0' : ''">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-rose-500 to-pink-400 flex items-center justify-center text-white font-bold text-xs flex-shrink-0 shadow">
          {{ (authApi.currentUser()?.full_name || 'Admin')[0].toUpperCase() }}
        </div>
        <div *ngIf="!collapsed" class="min-w-0 flex-1">
          <div class="text-xs font-semibold text-white truncate leading-tight">
            {{ authApi.currentUser()?.full_name || t.adminUser }}
          </div>
          <div class="text-[10px] text-white/50 truncate">
            {{ authApi.currentUser()?.email || 'admin@flowershop.com' }}
          </div>
        </div>
        <button (click)="logout()"
                class="text-white/60 hover:text-rose-300 p-1.5 rounded-lg hover:bg-white/10 transition-colors"
                [title]="t.logout">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 h-screen overflow-y-auto overflow-x-hidden p-6 md:p-8 lg:p-10">
    <div class="max-w-6xl mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
