<div class="flex h-screen bg-[#FAF7F2] font-sans">
  <!-- Sidebar -->
  <aside class="flex flex-col bg-[#2C1A2E] text-white transition-all duration-300 min-h-screen flex-shrink-0"
         [ngClass]="collapsed ? 'w-16' : 'w-56'">
    <div class="flex items-center gap-2 px-4 py-5 border-b border-white/10" [ngClass]="collapsed ? 'justify-center' : ''">
      <span class="text-2xl flex-shrink-0">🌸</span>
      <div *ngIf="!collapsed">
        <div class="font-serif text-base text-white leading-tight">Hoa Tươi</div>
        <div class="text-[10px] text-white/50">Admin Panel</div>
      </div>
    </div>
    
    <nav class="flex-1 py-4 space-y-1 px-2">
      <a *ngFor="let item of navItems"
         [routerLink]="item.link"
         routerLinkActive="bg-[#8B4A5C] text-white"
         [routerLinkActiveOptions]="{exact: true}"
         class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-colors text-white/60 hover:bg-white/10 hover:text-white"
         [ngClass]="collapsed ? 'justify-center' : ''"
         [title]="collapsed ? item.label : ''">
        <span class="text-base flex-shrink-0">{{ item.icon }}</span>
        <span *ngIf="!collapsed" class="font-medium">{{ item.label }}</span>
      </a>
    </nav>
    
    <div class="p-3 border-t border-white/10">
      <button (click)="toggleCollapse()"
              class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-white/50 hover:text-white hover:bg-white/10 transition-colors text-sm"
              [ngClass]="collapsed ? 'justify-center' : ''">
        <span>{{ collapsed ? '→' : '←' }}</span>
        <span *ngIf="!collapsed">Thu gọn</span>
      </button>
      <a routerLink="/"
         class="mt-1 w-full flex items-center gap-2 px-3 py-2 rounded-xl text-white/50 hover:text-white hover:bg-white/10 transition-colors text-sm"
         [ngClass]="collapsed ? 'justify-center' : ''"
         [title]="collapsed ? 'Về trang bán hàng' : ''">
        <span>🛒</span>
        <span *ngIf="!collapsed">Trang bán hàng</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 h-screen overflow-y-auto overflow-x-hidden p-6 md:p-10">
    <div class="max-w-6xl mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
