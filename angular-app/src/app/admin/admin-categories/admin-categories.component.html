<div class="space-y-5">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="font-serif text-3xl text-[#2C1A2E]">Danh mục</h1>
      <p class="text-sm text-[#7A6870] mt-0.5">{{ categories.length }} danh mục · {{ activeCount }} đang hoạt động</p>
    </div>
    <button (click)="toggleAdd()"
            class="flex items-center gap-2 px-4 py-2.5 bg-[#8B4A5C] text-white text-sm font-medium rounded-xl hover:bg-[#7A3D4F] transition-colors">
      <span>+</span> Thêm danh mục
    </button>
  </div>

  <div *ngIf="showAdd" class="bg-white rounded-2xl border border-[#EDE5DF] p-5">
    <h3 class="font-medium text-[#2C1A2E] mb-4">Thêm danh mục mới</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Tên danh mục</label>
        <input type="text" [(ngModel)]="newCategory.name"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Slug (Đường dẫn)</label>
        <input type="text" [(ngModel)]="newCategory.slug"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Thứ tự hiển thị</label>
        <input type="number" [(ngModel)]="newCategory.display_order"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
    </div>
    <div class="flex gap-3 mt-4">
      <button (click)="addCategory()" class="px-5 py-2 bg-[#8B4A5C] text-white text-sm rounded-xl hover:bg-[#7A3D4F]">Thêm</button>
      <button (click)="cancelAdd()" class="px-5 py-2 border border-[#DDD4CC] text-sm rounded-xl hover:bg-[#F3ECE7]">Huỷ</button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-[#EDE5DF] overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-[#F3ECE7]">
          <tr>
            <th *ngFor="let h of ['Tên danh mục', 'Slug', 'Thứ tự', 'Trạng thái', 'Thao tác']"
                class="text-left px-4 py-3 text-xs font-semibold text-[#7A6870] uppercase tracking-wide whitespace-nowrap">
              {{ h }}
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#EDE5DF]">
          <tr *ngFor="let c of categories" class="hover:bg-[#FAF7F2] transition-colors">
            <td class="px-4 py-3">
              <ng-container *ngIf="editId === c.id; else viewName">
                <input [ngModel]="c.translations?.[0]?.name || c.name" (blur)="saveEditString(c.id, 'name', $any($event.target).value)"
                       class="text-sm border-b border-[#8B4A5C] focus:outline-none w-full" />
              </ng-container>
              <ng-template #viewName>
                <div class="font-medium text-[#2C1A2E]">{{ c.translations?.[0]?.name || c.name }}</div>
              </ng-template>
            </td>
            <td class="px-4 py-3 text-[#7A6870]">
              <ng-container *ngIf="editId === c.id; else viewSlug">
                <input [ngModel]="c.slug" (blur)="saveEditString(c.id, 'slug', $any($event.target).value)"
                       class="text-sm border-b border-[#8B4A5C] focus:outline-none w-full" />
              </ng-container>
              <ng-template #viewSlug>{{ c.slug }}</ng-template>
            </td>
            <td class="px-4 py-3 text-[#7A6870]">{{ c.display_order || 0 }}</td>
            <td class="px-4 py-3">
              <button (click)="toggleActive(c.id)"
                      class="relative w-10 h-5 rounded-full transition-colors"
                      [ngClass]="c.is_active ? 'bg-[#7A9E7E]' : 'bg-[#DDD4CC]'">
                <span class="absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all"
                      [ngClass]="c.is_active ? 'left-5' : 'left-0.5'"></span>
              </button>
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="flex items-center gap-2">
                <button (click)="setEditId(c.id)"
                        class="text-xs px-2.5 py-1 border border-[#DDD4CC] rounded-lg hover:border-[#8B4A5C] transition-colors">
                  {{ editId === c.id ? 'Xong' : 'Sửa' }}
                </button>
                <button (click)="deleteCategory(c.id)" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition-colors" title="Xóa">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
