<div class="space-y-5">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="font-serif text-3xl text-[#2C1A2E]">Sản phẩm</h1>
      <p class="text-sm text-[#7A6870] mt-0.5">{{ products.length }} sản phẩm · {{ activeProductsCount }} đang bán</p>
    </div>
    <button (click)="toggleAdd()"
            class="flex items-center gap-2 px-4 py-2.5 bg-[#8B4A5C] text-white text-sm font-medium rounded-xl hover:bg-[#7A3D4F] transition-colors">
      <span>+</span> Thêm sản phẩm
    </button>
  </div>

  <div *ngIf="showAdd" class="bg-white rounded-2xl border border-[#EDE5DF] p-5">
    <h3 class="font-medium text-[#2C1A2E] mb-4">Thêm sản phẩm mới</h3>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Tên (tiếng Việt)</label>
        <input type="text" [(ngModel)]="newProd.nameVi"
               placeholder="Nhập tên tiếng Việt"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Tên (tiếng Hàn)</label>
        <input type="text" [(ngModel)]="newProd.nameKo"
               placeholder="Nhập tên tiếng Hàn"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Giá (VND)</label>
        <input type="number" [(ngModel)]="newProd.price"
               placeholder="VD: 500000"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Tồn kho</label>
        <input type="number" [(ngModel)]="newProd.stock"
               placeholder="VD: 10"
               class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
      </div>
      <div>
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Danh mục</label>
        <select [(ngModel)]="newProd.category"
                class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C] bg-white">
          <option *ngFor="let c of categoriesList" [value]="c.slug">{{ c.translations?.[0]?.name || c.name }}</option>
        </select>
      </div>
      <div class="relative">
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">Dịp tặng</label>
        <button type="button" 
                (click)="toggleNewOccDropdown($event)"
                class="mt-1 w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C] bg-white flex items-center justify-between text-left transition-colors hover:border-[#8B4A5C]">
          <span class="truncate" [ngClass]="newProd.occasions.length ? 'text-[#2C1A2E]' : 'text-[#A89E90]'">
            {{ getOccasionNames(newProd.occasions) }}
          </span>
          <svg class="w-4 h-4 text-[#7A6870] flex-shrink-0 ml-1 transition-transform" 
               [ngClass]="showNewOccDropdown ? 'rotate-180' : ''" 
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div *ngIf="showNewOccDropdown" 
             (click)="$event.stopPropagation()"
             class="absolute z-30 mt-1 w-full bg-white border border-[#DDD4CC] rounded-xl shadow-xl p-2 max-h-56 overflow-y-auto space-y-1">
          <label *ngFor="let occ of occasionsList" 
                 class="flex items-center gap-2 px-2.5 py-1.5 hover:bg-[#FAF7F2] rounded-lg cursor-pointer text-sm transition-colors">
            <input type="checkbox" 
                   [checked]="newProd.occasions.includes(occ.slug)" 
                   (change)="toggleNewProdOccasion(occ.slug)" 
                   class="accent-[#8B4A5C] rounded">
            <span class="text-[#2C1A2E]">{{ occ.translations?.[0]?.name || occ.name }}</span>
          </label>
        </div>
      </div>
      <div class="col-span-2 md:col-span-3">
        <label class="text-xs font-medium text-[#7A6870] uppercase tracking-wide">URL ảnh</label>
        <div class="flex items-center gap-3 mt-1">
          <input type="text" [(ngModel)]="newProd.img"
                 placeholder="Dán link ảnh (https://...)"
                 class="w-full border border-[#DDD4CC] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#8B4A5C]" />
          <img *ngIf="newProd.img" [src]="newProd.img" alt="Preview" class="w-10 h-10 rounded-lg object-cover bg-[#F3ECE7] flex-shrink-0 border border-[#DDD4CC]" />
        </div>
      </div>
    </div>
    <div class="flex gap-3 mt-4">
      <button (click)="addProduct()" class="px-5 py-2 bg-[#8B4A5C] text-white text-sm rounded-xl hover:bg-[#7A3D4F] transition-colors">Thêm</button>
      <button (click)="cancelAdd()" class="px-5 py-2 border border-[#DDD4CC] text-sm rounded-xl hover:bg-[#F3ECE7] transition-colors">Huỷ</button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-[#EDE5DF] overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-[#F3ECE7]">
          <tr>
            <th *ngFor="let h of ['Sản phẩm', 'Danh mục', 'Dịp', 'Giá bán', 'Tồn kho', 'Đã bán', 'Trạng thái', 'Thao tác']"
                class="text-left px-4 py-3 text-xs font-semibold text-[#7A6870] uppercase tracking-wide whitespace-nowrap">
              {{ h }}
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#EDE5DF]">
          <tr *ngFor="let p of products" class="hover:bg-[#FAF7F2] transition-colors">
            <td class="px-4 py-3 min-w-[240px]">
              <div class="flex items-start gap-3">
                <div class="relative group flex-shrink-0 cursor-pointer"
                     (click)="editId === p.id && changeImagePrompt(p)"
                     [title]="editId === p.id ? 'Nhấp để đổi URL ảnh' : ''">
                  <img [src]="p.img || 'https://images.unsplash.com/photo-1680563094046-5d846e2c59d1?w=200&h=200&fit=crop'"
                       [alt]="p.nameVi"
                       class="w-12 h-12 rounded-lg object-cover bg-[#F3ECE7] border border-[#DDD4CC] transition-all" />
                  <div *ngIf="editId === p.id"
                       class="absolute inset-0 bg-black/55 text-white rounded-lg flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-medium text-center p-0.5">
                    <svg class="w-3.5 h-3.5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>Đổi ảnh</span>
                  </div>
                </div>
                <div class="flex-1 min-w-0">
                  <ng-container *ngIf="editId === p.id; else viewName">
                    <div class="space-y-1">
                      <input [ngModel]="p.nameVi"
                             (blur)="saveEditString(p.id, 'nameVi', $any($event.target).value)"
                             (keyup.enter)="saveEditString(p.id, 'nameVi', $any($event.target).value)"
                             placeholder="Tên tiếng Việt"
                             title="Tên tiếng Việt"
                             class="text-sm font-medium border-b border-[#8B4A5C] focus:outline-none w-full bg-transparent" />
                      <input [ngModel]="p.nameKo"
                             (blur)="saveEditString(p.id, 'nameKo', $any($event.target).value)"
                             (keyup.enter)="saveEditString(p.id, 'nameKo', $any($event.target).value)"
                             placeholder="Tên tiếng Hàn"
                             title="Tên tiếng Hàn"
                             class="text-xs text-[#7A6870] border-b border-[#DDD4CC] focus:border-[#8B4A5C] focus:outline-none w-full bg-transparent" />
                      <div class="flex items-center gap-1.5 pt-0.5">
                        <span class="text-[10px] text-[#8B4A5C] font-semibold whitespace-nowrap">Ảnh:</span>
                        <input [(ngModel)]="p.img"
                               (blur)="saveEditImage(p.id, p.img)"
                               (keyup.enter)="saveEditImage(p.id, p.img)"
                               placeholder="Dán URL ảnh..."
                               title="Dán URL ảnh và nhấn Enter hoặc bấm ra ngoài để lưu"
                               class="text-xs text-[#2C1A2E] border-b border-[#DDD4CC] focus:border-[#8B4A5C] focus:outline-none w-full py-0.5 bg-transparent" />
                      </div>
                    </div>
                  </ng-container>
                  <ng-template #viewName>
                    <div class="font-medium text-[#2C1A2E] line-clamp-1">{{ p.nameVi }}</div>
                    <div class="text-xs text-[#7A6870] line-clamp-1">{{ p.nameKo }}</div>
                  </ng-template>
                </div>
              </div>
            </td>
            <td class="px-4 py-3 text-[#7A6870] whitespace-nowrap">
              <ng-container *ngIf="editId === p.id; else viewCat">
                <select [ngModel]="p.category" (change)="saveEditCategory(p.id, $any($event.target).value)" class="text-sm border-b border-[#8B4A5C] focus:outline-none bg-transparent">
                  <option *ngFor="let c of categoriesList" [value]="c.slug">{{ c.translations?.[0]?.name || c.name }}</option>
                </select>
              </ng-container>
              <ng-template #viewCat>{{ p.category }}</ng-template>
            </td>
            <td class="px-4 py-3 text-[#7A6870] whitespace-normal min-w-[150px]">
              <ng-container *ngIf="editId === p.id; else viewOcc">
                <div class="relative">
                  <button type="button" 
                          (click)="toggleRowOccDropdown(p.id, $event)"
                          class="flex items-center justify-between gap-1.5 px-2.5 py-1.5 border border-[#DDD4CC] rounded-xl text-xs bg-white hover:border-[#8B4A5C] w-full text-left transition-colors">
                    <span class="truncate max-w-[140px] text-[#2C1A2E] font-medium">
                      {{ getOccasionNames(p.occasions) }}
                    </span>
                    <svg class="w-3.5 h-3.5 text-[#7A6870] flex-shrink-0 transition-transform" 
                         [ngClass]="rowOccDropdownId === p.id ? 'rotate-180' : ''"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </button>

                  <div *ngIf="rowOccDropdownId === p.id" 
                       (click)="$event.stopPropagation()"
                       class="absolute left-0 z-40 mt-1 w-56 bg-white border border-[#DDD4CC] rounded-xl shadow-xl p-2 max-h-56 overflow-y-auto space-y-1">
                    <label *ngFor="let occ of occasionsList" 
                           class="flex items-center gap-2 px-2 py-1.5 hover:bg-[#FAF7F2] rounded-lg cursor-pointer text-xs transition-colors">
                      <input type="checkbox" 
                             [checked]="p.occasions.includes(occ.slug)" 
                             (change)="saveEditOccasion(p.id, occ.slug)" 
                             class="accent-[#8B4A5C] rounded">
                      <span class="text-[#2C1A2E]">{{ occ.translations?.[0]?.name || occ.name }}</span>
                    </label>
                  </div>
                </div>
              </ng-container>
              <ng-template #viewOcc>
                <div class="flex flex-wrap gap-1">
                  <span *ngFor="let occ of p.occasions" class="px-2 py-0.5 bg-[#F3ECE7] rounded-full text-xs text-[#2C1A2E] font-medium">{{ getOccasionDisplayName(occ) }}</span>
                </div>
              </ng-template>
            </td>
            <td class="px-4 py-3">
              <ng-container *ngIf="editId === p.id; else viewPrice">
                <input type="number" [ngModel]="p.price" (blur)="saveEditNumber(p.id, 'price', $any($event.target).value)"
                       class="w-24 text-sm border-b border-[#8B4A5C] focus:outline-none" />
              </ng-container>
              <ng-template #viewPrice>
                <span class="font-medium text-[#8B4A5C] font-serif">{{ fmt(p.price) }}đ</span>
              </ng-template>
            </td>
            <td class="px-4 py-3">
              <ng-container *ngIf="editId === p.id; else viewStock">
                <input type="number" [ngModel]="p.stock" (blur)="saveEditNumber(p.id, 'stock', $any($event.target).value)"
                       class="w-16 text-sm border-b border-[#8B4A5C] focus:outline-none" />
              </ng-container>
              <ng-template #viewStock>
                <span class="font-medium" [ngClass]="p.stock <= 5 ? 'text-red-600' : 'text-[#2C1A2E]'">{{ p.stock }}</span>
              </ng-template>
            </td>
            <td class="px-4 py-3 text-[#7A6870]">{{ p.sold }}</td>
            <td class="px-4 py-3">
              <button (click)="toggleActive(p.id)"
                      class="relative w-10 h-5 rounded-full transition-colors"
                      [ngClass]="p.active ? 'bg-[#7A9E7E]' : 'bg-[#DDD4CC]'">
                <span class="absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all"
                      [ngClass]="p.active ? 'left-5' : 'left-0.5'"></span>
              </button>
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="flex items-center gap-2">
                <button (click)="setEditId(p.id)"
                        class="text-xs px-2.5 py-1 border border-[#DDD4CC] rounded-lg hover:border-[#8B4A5C] transition-colors">
                  {{ editId === p.id ? 'Xong' : 'Sửa' }}
                </button>
                <button (click)="deleteProduct(p.id)" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition-colors" title="Xóa">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
