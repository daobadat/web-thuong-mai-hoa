<div class="min-h-screen flex items-center justify-center p-3 sm:p-4 bg-rose-50/50">
  <div class="bg-white max-w-md w-full p-5 sm:p-8 rounded-2xl sm:rounded-3xl border border-rose-100 shadow-xl space-y-5 sm:space-y-6">
    <div class="text-center space-y-2">
      <a routerLink="/" class="inline-flex items-center gap-2 mb-2">
        <div class="w-10 h-10 rounded-2xl bg-[#7A2838] flex items-center justify-center text-white text-xl">🌸</div>
        <span class="font-serif text-xl font-bold text-[#7A2838]">HOA TƯƠI</span>
      </a>
      <h1 class="text-xl sm:text-2xl font-serif font-bold text-gray-900">Mừng Bạn Trở Lại!</h1>
      <p class="text-xs text-gray-500">Đăng nhập tài khoản để nhận voucher ưu đãi</p>
    </div>

    <!-- Error message -->
    <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ errorMsg }}</span>
    </div>

    <form (submit)="onLogin($event)" class="space-y-4 text-sm">
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Email / Số điện thoại</label>
        <input type="text" [(ngModel)]="email" name="email" required placeholder="nhapemail@gmail.com" class="w-full px-4 py-2.5 bg-rose-50/40 border border-rose-200 rounded-xl focus:outline-none focus:border-[#7A2838] transition-colors">
      </div>
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Mật khẩu</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-rose-50/40 border border-rose-200 rounded-xl focus:outline-none focus:border-[#7A2838] transition-colors pr-12">
          <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-0 px-4 text-gray-500 hover:text-gray-700 focus:outline-none">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading"
        class="w-full py-3 bg-[#7A2838] hover:bg-[#5C2129] text-white font-bold rounded-xl shadow transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span *ngIf="loading" class="inline-block w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
        {{ loading ? 'Đang xử lý...' : 'Đăng Nhập' }}
      </button>
    </form>

    <!-- Hoặc Đăng nhập bằng Google -->
    <div class="space-y-3 pt-2">
      <div class="relative flex items-center justify-center">
        <div class="border-t border-rose-100 w-full"></div>
        <span class="bg-white px-3 text-xs text-gray-400 font-medium uppercase tracking-wider">Hoặc</span>
        <div class="border-t border-rose-100 w-full"></div>
      </div>

      <!-- Nút Google Đăng nhập -->
      <div class="relative flex justify-center">
        <button type="button" (click)="onGoogleClick()"
          class="w-full py-3 px-4 bg-white hover:bg-gray-50 border border-gray-300 rounded-xl shadow-sm transition-all flex items-center justify-center gap-3 text-sm font-semibold text-gray-700 hover:shadow cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Tiếp tục với Google</span>
        </button>

        <!-- Overlay Google GSI button để click thẳng vào popup Google -->
        <div id="google-btn-container" class="absolute inset-0 opacity-0 overflow-hidden flex items-center justify-center cursor-pointer z-10"></div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500 pt-2 border-t border-rose-100 gap-2">
      <span>Chưa có tài khoản? <a routerLink="/auth/register" class="text-[#7A2838] font-bold hover:underline">Đăng ký ngay</a></span>
      <a routerLink="/auth/forgot-password" class="text-[#7A2838] hover:underline">Quên mật khẩu?</a>
    </div>
  </div>
</div>
