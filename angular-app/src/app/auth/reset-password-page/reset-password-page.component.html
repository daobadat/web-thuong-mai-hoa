<div class="min-h-screen flex items-center justify-center p-4 bg-rose-50/50">
  <div class="bg-white max-w-md w-full p-8 rounded-3xl border border-rose-100 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <a routerLink="/" class="inline-flex items-center gap-2 mb-2">
        <div class="w-10 h-10 rounded-2xl bg-[#7A2838] flex items-center justify-center text-white text-xl">🌸</div>
        <span class="font-serif text-xl font-bold text-[#7A2838]">HOA TƯƠI</span>
      </a>
      <h1 class="text-2xl font-serif font-bold text-gray-900">Tạo mật khẩu mới</h1>
      <p class="text-xs text-gray-500">Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>
    </div>

    <!-- Error message -->
    <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ errorMsg }}</span>
    </div>

    <!-- Success message -->
    <div *ngIf="successMsg" class="bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-xl flex flex-col gap-2">
      <div class="flex items-center gap-2">
        <span>✅</span>
        <span class="font-bold">Thành công!</span>
      </div>
      <p>{{ successMsg }}</p>
      <p class="text-xs mt-1">Đang chuyển hướng về trang đăng nhập...</p>
    </div>

    <form *ngIf="!successMsg && token" (submit)="onSubmit($event)" class="space-y-4 text-sm">
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Mật khẩu mới</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required placeholder="••••••••" minlength="6" class="w-full px-4 py-2.5 bg-rose-50/40 border border-rose-200 rounded-xl focus:outline-none focus:border-[#7A2838] transition-colors pr-12">
          <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-0 px-4 text-gray-500 hover:text-gray-700 focus:outline-none">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="block font-semibold text-gray-700 mb-1">Xác nhận mật khẩu mới</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="••••••••" minlength="6" class="w-full px-4 py-2.5 bg-rose-50/40 border border-rose-200 rounded-xl focus:outline-none focus:border-[#7A2838] transition-colors pr-12">
        </div>
      </div>

      <button type="submit" [disabled]="loading"
        class="w-full py-3 bg-[#7A2838] hover:bg-[#5C2129] text-white font-bold rounded-xl shadow transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span *ngIf="loading" class="inline-block w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
        {{ loading ? 'Đang cập nhật...' : 'Đổi mật khẩu' }}
      </button>
    </form>

    <div class="text-center text-xs text-gray-500 pt-2 border-t border-rose-100">
      <a routerLink="/auth/login" class="text-[#7A2838] font-bold hover:underline">← Quay lại trang đăng nhập</a>
    </div>
  </div>
</div>
