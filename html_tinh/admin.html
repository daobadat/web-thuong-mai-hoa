    // ─── SIDEBAR COLLAPSE TOGGLE ─────────────────────────────────────────────

      isSidebarCollapsed = !isSidebarCollapsed
      const sidebar = document.getElementById('sidebar')
      const texts = document.querySelectorAll('.nav-text')
      const brandText = document.getElementById('sidebar-brand-text')
      const icon = document.getElementById('collapse-icon')

      if (isSidebarCollapsed) {
        sidebar.className = 'flex flex-col bg-[#2C1A2E] text-white transition-all duration-300 w-16 min-h-screen flex-shrink-0'
        texts.forEach(t => t.classList.add('hidden'))
        brandText.classList.add('hidden')
        icon.textContent = '→'
      } else {
        sidebar.className = 'flex flex-col bg-[#2C1A2E] text-white transition-all duration-300 w-56 min-h-screen flex-shrink-0'
        texts.forEach(t => t.classList.remove('hidden'))
        brandText.classList.remove('hidden')
        icon.textContent = '←'
      }
    }

      currentPage = pg
      const pages = ['dashboard', 'orders', 'products', 'customers', 'analytics', 'settings']
      pages.forEach(p => {
        const btn = document.getElementById(`nav-btn-${p}`)
        if (p === pg) {
          btn.className = 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-colors bg-[#8B4A5C] text-white'
        } else {
          btn.className = 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-colors text-white/60 hover:bg-white/10 hover:text-white'
        }
      })

      renderAdminPage()
    }

    function renderAdminPage() {
      const main = document.getElementById('admin-main-view')
      if (currentPage === 'dashboard') renderDashboard(main)
      else if (currentPage === 'orders') renderOrders(main)
      else if (currentPage === 'products') renderProducts(main)
      else if (currentPage === 'customers') renderCustomers(main)
      else if (currentPage === 'analytics') renderAnalytics(main)
      else if (currentPage === 'settings') renderSettings(main)
    }

              </div>

                <div class="text-xs font-medium opacity-70 mb-1">Đã hoàn thành hôm nay</div>
                <span class="text-xl">✅</span>
              </div>

        renderAdminPage()

    function submitNewProduct(e) {
      e.preventDefault()
      const nameVi = document.getElementById('add-p-namevi').value
      const nameKo = document.getElementById('add-p-nameko').value
      const price = Number(document.getElementById('add-p-price').value)
      const stock = Number(document.getElementById('add-p-stock').value)
      const img = document.getElementById('add-p-img').value || 'https://images.unsplash.com/photo-1680563094046-5d846e2c59d1?w=200&h=200&fit=crop'
      const category = document.getElementById('add-p-cat').value

      const id = Math.max(...PRODUCTS.map(p => p.id)) + 1
      PRODUCTS.push({ id, nameVi, nameKo, category, price, stock, sold: 0, img, active: true })

      showAddProductForm = false
      renderAdminPage()
    }

    function toggleProductActive(id) {
      const p = PRODUCTS.find(x => x.id === id)
      if (p) { p.active = !p.active; renderAdminPage(); }
    }

    function toggleProductEdit(id) {
      productEditId = productEditId === id ? null : id
      renderAdminPage()
    }

    function saveProductEdit(id, field, value) {
      const p = PRODUCTS.find(x => x.id === id)
      if (p) { p[field] = value; }
    }
